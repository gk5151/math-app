const SUPABASE_URL = "https://dfpqaxzcjqyicohmomuh.supabase.co";

<script>
const SUBJECTS = {
  math: { name: "数学" },
  info: { name: "情報" }
};

const DEFAULT_ITEMS = {
  math: [
    { id: "simulator", title: "シミュレータ", description: "数学のシミュレータをまとめます。", visible: true },
    { id: "resources", title: "資料", description: "授業資料や参考資料をまとめます。", visible: true }
  ],
  info: [
    { id: "simulator", title: "シミュレータ", description: "情報のシミュレータをまとめます。", visible: true },
    { id: "resources", title: "資料", description: "授業資料や参考資料をまとめます。", visible: true }
  ]
};


let data;
let role = "";
let page = "home";
let subject = "math";
let subjectChangeSelected = "math";
let accessToken = sessionStorage.getItem("study_note_access_token") || "";
let hostUserId = sessionStorage.getItem("study_note_host_user_id") || "";

const $ = id => document.getElementById(id);

function authHeaders(extra = {}) {
  const headers = {
    // Publishable key は API キーとして apikey にだけ送る。
    // サインイン済みの場合だけ、ユーザーJWTを Authorization に送る。
    apikey: SUPABASE_PUBLISHABLE_KEY,
    ...extra
  };
  if (accessToken) headers.Authorization = `Bearer ${accessToken}`;
  return headers;
}

function explainNetworkError(e, context = "Supabase") {
  const msg = String(e?.message || e || "不明なエラー");
  if (location.protocol === "file:") {
    return `${context}に接続できませんでした。現在HTMLを直接開いています。GitHub Pagesの https://... から開いて再試行してください。\n元のエラー: ${msg}`;
  }
  if (/Failed to fetch|NetworkError|Load failed|CORS/i.test(msg)) {
    return `${context}に接続できませんでした。Project URL・Publishable key・ネットワーク/CORSを確認してください。\n元のエラー: ${msg}`;
  }
  return msg;
}

async function cloudFetch(url, options = {}, context = "Supabase") {
  if (!CLOUD_ENABLED) throw new Error("Supabaseの設定がありません。");
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch(url, {
      mode: "cors",
      cache: "no-store",
      ...options,
      signal: controller.signal
    });
    if (!response.ok) {
      let detail = "";
      try { detail = await response.text(); } catch (_) {}
      throw new Error(`${context} HTTP ${response.status}${detail ? `: ${detail}` : ""}`);
    }
    return response;
  } catch (e) {
    if (e?.name === "AbortError") {
      throw new Error(`${context}への接続がタイムアウトしました（15秒）。`);
    }
    throw new Error(explainNetworkError(e, context));
  } finally {
    clearTimeout(timer);
  }
}

function setCloudStatus(message, ok = null) {
  const el = $("cloudStatus");
  if (!el) return;
  el.textContent = message;
  el.classList.toggle("ok", ok === true);
  el.classList.toggle("bad", ok === false);
}

async function checkCloudConnection() {
  if (!CLOUD_ENABLED) {
    setCloudStatus("Supabase未設定", false);
    return false;
  }
  try {
    // 軽いSELECTで、URL・Publishable key・REST API・RLSの読み取り経路をまとめて確認
    const r = await cloudFetch(
      `${SUPABASE_URL}/rest/v1/study_note_data?select=subject&limit=1`,
      { headers: authHeaders() },
      "Supabase接続確認"
    );
    await r.json();
    setCloudStatus("クラウド接続OK", true);
    return true;
  } catch (e) {
    setCloudStatus(e.message || "クラウド接続に失敗しました", false);
    console.error(e);
    return false;
  }
}

async function loginHost() {
  if (!CLOUD_ENABLED) throw new Error("SupabaseのProject URLとPublishable keyを設定してください");
  const email = $("hostEmail").value.trim();
  const password = $("hostPassword").value;
  if (!email || !password) throw new Error("ホスト用メールアドレスとパスワードを入力してください");

  const r = await cloudFetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPABASE_PUBLISHABLE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  }, "ホストログイン");
  const session = await r.json();
  if (!session.access_token || !session.user?.id) throw new Error("ログイン情報を取得できませんでした");

  accessToken = session.access_token;
  hostUserId = session.user.id;
  const hostCheck = await cloudFetch(`${SUPABASE_URL}/rest/v1/host_users?select=user_id&user_id=eq.${encodeURIComponent(hostUserId)}`, {
    headers: authHeaders()
  }, "ホスト権限確認");
  const rows = await hostCheck.json();
  if (!rows.length) {
    accessToken = ""; hostUserId = "";
    throw new Error("このアカウントにはホスト権限がありません");
  }

  sessionStorage.setItem("study_note_access_token", accessToken);
  sessionStorage.setItem("study_note_host_user_id", hostUserId);
}

async function logoutHost() {
  if (CLOUD_ENABLED && accessToken) {
    try {
      await cloudFetch(`${SUPABASE_URL}/auth/v1/logout`, { method: "POST", headers: authHeaders() }, "ログアウト");
    } catch (e) {}
  }
  accessToken = ""; hostUserId = "";
  sessionStorage.removeItem("study_note_access_token");
  sessionStorage.removeItem("study_note_host_user_id");
}

function createDefaultData() {
  return {
    math: {
      items: JSON.parse(JSON.stringify(DEFAULT_ITEMS.math)),
      note: { date: new Date().toLocaleDateString("ja-JP"), title: "今日の授業", body: "ここに先生のメモを表示できます。" },
      simulators: [], resources: [], comments: []
    },
    info: {
      items: JSON.parse(JSON.stringify(DEFAULT_ITEMS.info)),
      note: { date: new Date().toLocaleDateString("ja-JP"), title: "今日の授業", body: "ここに先生のメモを表示できます。" },
      simulators: [], resources: [], comments: []
    }
  };
}

function loadLocalData() {
  try { return JSON.parse(localStorage.getItem("study_note_data_v3")); } catch (e) { return null; }
}

async function loadData() {
  data = loadLocalData() || createDefaultData();
  if (!CLOUD_ENABLED) return false;

  const results = await Promise.all(["math", "info"].map(async (sub) => {
    const r = await cloudFetch(`${SUPABASE_URL}/rest/v1/study_note_data?subject=eq.${encodeURIComponent(sub)}&select=data`, {
      headers: authHeaders()
    }, `データ読み込み（${SUBJECTS[sub].name}）`);
    const rows = await r.json();
    return [sub, rows[0] ? rows[0].data : null];
  }));

  results.forEach(([sub, cloud]) => { if (cloud) data[sub] = cloud; });

  // 旧データに残っている不要な教材項目を表示対象から完全除外。
  ["math", "info"].forEach(sub => {
    data[sub] = data[sub] || createDefaultData()[sub];
    data[sub].items = (data[sub].items || []).filter(item => item.id === "simulator" || item.id === "resources");
    const defaults = DEFAULT_ITEMS[sub];
    defaults.forEach(def => {
      if (!data[sub].items.some(item => item.id === def.id)) data[sub].items.push({ ...def });
    });
    data[sub].simulators = Array.isArray(data[sub].simulators) ? data[sub].simulators : [];
    data[sub].resources = Array.isArray(data[sub].resources) ? data[sub].resources : [];
    data[sub].simulators.forEach(sim => { if (sim.visible === undefined) sim.visible = true; });
    data[sub].resources.forEach(res => { if (res.visible === undefined) res.visible = true; });
  });
  localStorage.setItem("study_note_data_v3", JSON.stringify(data));
  setCloudStatus("クラウド接続OK・共有データを読み込みました", true);
  return true;
}

async function save() {
  localStorage.setItem("study_note_data_v3", JSON.stringify(data));
  if (!CLOUD_ENABLED) return true;

  try {
    const curr = data[subject];
    await cloudFetch(`${SUPABASE_URL}/rest/v1/study_note_data?on_conflict=subject`, {
      method: "POST",
      headers: authHeaders({
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=minimal"
      }),
      body: JSON.stringify({ subject, data: curr, updated_at: new Date().toISOString() })
    }, `データ保存（${SUBJECTS[subject].name}）`);
    setCloudStatus("クラウド保存OK", true);
    return true;
  } catch (e) {
    console.error("クラウド保存失敗", e);
    setCloudStatus(e.message || "クラウド保存に失敗しました", false);
    alert("クラウドへの保存に失敗しました。\n\n" + e.message);
    return false;
  }
}

async function uploadToCloud(file, folder) {
  if (!CLOUD_ENABLED) throw new Error("Supabaseが設定されていません");
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `${folder}/${Date.now()}_${safeName}`;
  await cloudFetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${path}`, {
    method: "POST",
    headers: authHeaders({
      "Content-Type": /\.html?$/i.test(file.name) ? "text/html;charset=utf-8" : (file.type || "application/octet-stream"),
      "x-upsert": "false"
    }),
    body: file
  }, "ファイルアップロード");
  return `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${path}`;
}

async function deleteCloudFile(url) {
  if (!CLOUD_ENABLED || !url || !url.includes(`/storage/v1/object/public/${SUPABASE_BUCKET}/`)) return;
  const path = url.split(`/storage/v1/object/public/${SUPABASE_BUCKET}/`)[1];
  try {
    await cloudFetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${path}`, {
      method: "DELETE",
      headers: authHeaders()
    }, "ファイル削除");
  } catch (e) {
    console.warn("クラウドファイル削除失敗", e);
    setCloudStatus(e.message || "ファイル削除に失敗しました", false);
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function visibleItems() {
  return data[subject].items.filter(item => (item.id === "simulator" || item.id === "resources") && item.visible);
}

function getCurrentData() {
  return data[subject];
}

  visibleItems().forEach(item => {
    html += `<button class="${page === item.id ? "active" : ""}" onclick="go('${item.id}')">${item.title}</button>`;
  });

  if (role === "host") {
    html += `<button class="${page === "admin" ? "active" : ""}" onclick="go('admin')">管理</button>`;
  }

  $("nav").innerHTML = html;
}

function render() {

  else if (page === "simulator") renderSimulator();
  else if (page === "resources") renderResources();
}

function renderSimulator() {
  const currData = getCurrentData();
  const sims = role === "host" ? currData.simulators : currData.simulators.filter(sim => sim.visible !== false);

  let html = `
    <button class="back" onclick="go('home')">← 戻る</button>
    <h2 class="section">シミュレータ</h2>
  `;

  if (sims.length === 0) {
    html += `<p>${role === "host" ? "シミュレータがまだ追加されていません。" : "公開されているシミュレータがありません。"}</p>`;
  } else {
    sims.forEach((sim) => {
      const idx = currData.simulators.indexOf(sim);
      html += `
        <div class="sim">
          <h3>${escapeHTML(sim.name)}</h3>
          <p>${escapeHTML(sim.desc)}</p>
          ${sim.fileUrl ? `<iframe id="simFrame_${idx}" style="width:100%; height:500px; border:1px solid #ddd; border-radius:4px;"></iframe>` : ""}
          ${sim.fileContent ? `<iframe srcdoc="${sim.fileContent.replace(/"/g, '&quot;')}" style="width:100%; height:500px; border:1px solid #ddd; border-radius:4px;"></iframe>` : ""}
          ${(sim.fileUrl || sim.fileContent) ? `<button class="sim-open-button" onclick="openSimulator(${idx})">↗ シミュレータを別画面で開く</button>` : ""}
          ${role === "host" ? `
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px;">
              <button class="toggle" onclick="toggleSimulatorVisibility(${idx})">${sim.visible === false ? "公開する" : "非公開にする"}</button>
              <span style="font-size:12px; color:var(--ink-soft);">現在：${sim.visible === false ? "非公開" : "公開"}</span>
              <button onclick="deleteSimulator(${idx})" style="background:#f0f0f0; color:var(--red); border:1px solid var(--red);">削除</button>
            </div>` : ""}
        </div>
      `;
    });
  }

  $("main").innerHTML = html;

  sims.forEach((sim) => {
    if (sim.fileUrl) {
      const idx = currData.simulators.indexOf(sim);
      loadSimulatorFrame(idx, sim.fileUrl);
    }
  });
}

async function loadSimulatorFrame(idx, fileUrl) {
  const frame = document.getElementById(`simFrame_${idx}`);
  if (!frame) return;
  try {
    const res = await fetch(fileUrl, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const blob = new Blob([text], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    frame.onload = () => setTimeout(() => URL.revokeObjectURL(url), 60000);
    frame.src = url;
  } catch (e) {
    console.error("シミュレータ読み込み失敗", e);
    frame.src = fileUrl;
  }
}

async function openSimulator(idx) {
  const sim = getCurrentData().simulators[idx];
  if (!sim) return;
  if (sim.fileUrl) {
    try {
      const res = await fetch(sim.fileUrl, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const blob = new Blob([text], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const win = window.open(url, "_blank");
      if (!win) { alert("ポップアップがブロックされています。ブラウザの設定を確認してください。"); URL.revokeObjectURL(url); return; }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return;
    } catch (e) {
      console.error("シミュレータを開けません", e);
      window.open(sim.fileUrl, "_blank", "noopener");
      return;
    }
  }
  if (sim.fileContent) {
    const blob = new Blob([sim.fileContent], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const win = window.open(url, "_blank");
    if (!win) { alert("ポップアップがブロックされています。ブラウザの設定を確認してください。"); URL.revokeObjectURL(url); return; }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
}

let simFileContent = null;

function handleSimFileSelect() {
  const file = $("simFileInput").files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    simFileContent = e.target.result;
    $("simFileSelected").textContent = `✓ ${escapeHTML(file.name)} を選択しました`;
  };
  reader.readAsText(file);
}



function renderResources() {
  const currData = getCurrentData();
  const resources = role === "host" ? currData.resources : currData.resources.filter(res => res.visible !== false);

  let html = `
    <button class="back" onclick="go('home')">← 戻る</button>
    <h2 class="section">資料</h2>
  `;

  if (resources.length === 0) {
    html += `<p>${role === "host" ? "資料がまだ追加されていません。" : "公開されている資料がありません。"}</p>`;
  } else {
    html += `<ul class="resource-list">`;
    resources.forEach((res) => {
      const i = currData.resources.indexOf(res);
      html += `
        <li class="resource-item">
          <div class="resource-info">
            <h3>${escapeHTML(res.name)}</h3>
            <p>${escapeHTML(res.desc)}</p>
            ${res.link ? `<p style="margin-top: 5px;"><a href="${escapeHTML(res.link)}" target="_blank" rel="noopener">${escapeHTML(res.link)}</a></p>` : ""}
            ${(res.fileContent || res.fileUrl) ? `<div style="margin-top:8px;"><button class="open" onclick="downloadResourceFile(${i})">ファイルを開く / 保存</button><div style="font-size:11px; color:#999; margin-top:4px;">${escapeHTML(res.fileName || "添付ファイル")}</div></div>` : ""}
            <p style="font-size: 11px; color: #999; margin-top: 3px;"><strong>追加日:</strong> ${escapeHTML(res.date)}</p>
          </div>
          ${role === "host" ? `<div class="resource-actions" style="flex-wrap:wrap; align-items:center;">
            <button class="toggle" onclick="toggleResourceVisibility(${i})">${res.visible === false ? "公開する" : "非公開にする"}</button>
            <span style="font-size:11px; color:var(--ink-soft);">${res.visible === false ? "非公開" : "公開"}</span>
            <button class="delete-btn" onclick="deleteResource(${i})">削除</button>
          </div>` : ""}
        </li>
      `;
    });
    html += `</ul>`;
  }

  $("main").innerHTML = html;
}


async function toggleSimulatorVisibility(idx) {
  const currData = getCurrentData();
  const sim = currData.simulators[idx];
  if (!sim) return;
  sim.visible = sim.visible === false;
  const ok = await save();
  if (CLOUD_ENABLED && !ok) return;
  renderSimulator();
}

async function toggleResourceVisibility(idx) {
  const currData = getCurrentData();
  const res = currData.resources[idx];
  if (!res) return;
  res.visible = res.visible === false;
  const ok = await save();
  if (CLOUD_ENABLED && !ok) return;
  renderResources();
}

async function saveNote() {
  const currData = getCurrentData();
  currData.note = {
    date: $("noteDate").value,
    title: $("noteTitle").value,
    body: $("noteBody").value
  };
  const ok = await save();
  if (CLOUD_ENABLED && !ok) return;
  alert(CLOUD_ENABLED ? "メモをクラウドに保存しました" : "メモを保存しました");
  render();
}

async function addSimulator() {
  const currData = getCurrentData();
  const name = $("simName").value.trim();
  const desc = $("simDesc").value.trim();
  const file = $("simFileInput").files[0];

  if (!name) { alert("シミュレータ名を入力してください"); return; }
  if (!file) { alert("HTMLファイルを選択してください"); return; }

  try {
    let fileUrl = "";
    if (CLOUD_ENABLED) {
      fileUrl = await uploadToCloud(file, `${subject}/simulators`);
    }
    currData.simulators.push({ name, desc, visible: true, fileContent: CLOUD_ENABLED ? "" : (simFileContent || ""), fileUrl, fileName: file.name, date: new Date().toLocaleDateString("ja-JP") });
    await save();
    $("simName").value = ""; $("simDesc").value = ""; $("simFileInput").value = ""; $("simFileSelected").textContent = ""; simFileContent = null;
    alert(CLOUD_ENABLED ? "シミュレータをクラウドに公開しました" : "シミュレータを追加しました（端末保存）");
    renderAdmin();
  } catch (e) {
    console.error(e); alert("シミュレータのアップロードに失敗しました。\n" + e.message);
  }
}

async function deleteSimulator(idx) {
  const currData = getCurrentData();
  if (!confirm("このシミュレータを削除しますか？")) return;
  const sim = currData.simulators[idx];
  currData.simulators.splice(idx, 1);
  await deleteCloudFile(sim?.fileUrl);
  await save();
  renderSimulator();
}

let resourceFileContent = null;
let resourceFileName = "";

function handleResourceFileSelect() {
  const file = $("resFileInput").files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    resourceFileContent = e.target.result;
    resourceFileName = file.name;
    $("resFileSelected").textContent = `✓ ${escapeHTML(file.name)} を選択しました`;
  };
  reader.readAsDataURL(file);
}

function downloadResourceFile(idx) {
  const res = getCurrentData().resources[idx];
  if (!res) return;
  const url = res.fileUrl || res.fileContent;
  if (!url) return;
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  if (!res.fileUrl) a.download = res.fileName || "resource-file";
  document.body.appendChild(a); a.click(); a.remove();
}

async function addResource() {
  const currData = getCurrentData();
  const name = $("resName").value.trim();
  const desc = $("resDesc").value.trim();
  const link = $("resLink").value.trim();
  const file = $("resFileInput").files[0];

  if (!name) { alert("資料名を入力してください"); return; }
  if (!link && !file) { alert("リンクまたはファイルのどちらかを追加してください"); return; }

  try {
    let fileUrl = "";
    if (file && CLOUD_ENABLED) fileUrl = await uploadToCloud(file, `${subject}/resources`);
    currData.resources.push({ name, desc, link, visible: true, fileContent: file && !CLOUD_ENABLED ? (resourceFileContent || "") : "", fileUrl, fileName: file ? file.name : "", date: new Date().toLocaleDateString("ja-JP") });
    await save();
    $("resName").value = ""; $("resDesc").value = ""; $("resLink").value = ""; $("resFileInput").value = ""; $("resFileSelected").textContent = ""; resourceFileContent = null; resourceFileName = "";
    alert(CLOUD_ENABLED ? "資料をクラウドに公開しました" : "資料を追加しました（端末保存）");
    renderAdmin();
  } catch (e) {
    console.error(e); alert("資料のアップロードに失敗しました。\n" + e.message);
  }
}

async function deleteResource(i) {
  const currData = getCurrentData();
  if (!confirm("この資料を削除しますか？")) return;
  const res = currData.resources[i];
  currData.resources.splice(i, 1);
  await deleteCloudFile(res?.fileUrl);
  await save();
  renderResources();
}

// ===== INITIALIZE =====
(async function initializeApp() {
  try {
    await loadData();
  } catch (e) {
    console.error("クラウド初期読み込み失敗", e);
    setCloudStatus(e.message || "クラウド読み込みに失敗しました", false);
    // 表示自体は止めず、ローカルのバックアップデータで起動します。
    // ただし赤い接続状態を表示して「共有できている」と誤認しないようにします。
  }
  await checkCloudConnection();
  const savedRole = sessionStorage.getItem("study_note_role");
  const savedSubject = sessionStorage.getItem("study_note_subject");

  if (savedRole === "guest") {
    role = "guest";
    subject = savedSubject || "math";
    if (subject === "math") { $("mathSubject").classList.add("active"); $("infoSubject").classList.remove("active"); }
    else { $("infoSubject").classList.add("active"); $("mathSubject").classList.remove("active"); }
    start();
  } else if (savedRole === "host" && accessToken && hostUserId && CLOUD_ENABLED) {
    try {
      const r = await cloudFetch(`${SUPABASE_URL}/rest/v1/host_users?select=user_id&user_id=eq.${encodeURIComponent(hostUserId)}`, { headers: authHeaders() }, "ホストセッション確認");
      const rows = await r.json();
      if (rows.length) {
        role = "host"; subject = savedSubject || "math"; start();
      } else { await logoutHost(); sessionStorage.removeItem("study_note_role"); }
    } catch (e) { await logoutHost(); sessionStorage.removeItem("study_note_role"); }
  }
})();
