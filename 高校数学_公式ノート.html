<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>公式ノート — 高校数学公式集</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF;
    --paper2:#F3EEE0;
    --ink:#20281F;
    --ink-soft:#5B6357;
    --line:#D9D2BC;
    --margin-red:#C0574A;
    --accent:#2E6B58;
    --accent-soft:#DCEAE3;
    --amber:#C4842B;
    --amber-soft:#F3E2C4;
    --shadow: 0 1px 0 rgba(32,40,31,0.06);
  }
  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{
    margin:0;
    background:var(--paper) !important;
    color:var(--ink) !important;
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      linear-gradient(var(--paper2) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper2) 1px, transparent 1px);
    background-size: 26px 26px;
    background-position: -1px -1px;
  }

  header{
    padding:22px 16px 14px;
    border-bottom:2px solid var(--ink);
    position:relative;
    background:linear-gradient(180deg, rgba(250,247,239,0.97), rgba(250,247,239,0.9));
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(2px);
  }
  header::before{
    content:"";
    position:absolute;
    left:44px; top:0; bottom:0;
    width:2px;
    background:var(--margin-red);
    opacity:0.55;
  }
  h1{
    font-family:'Shippori Mincho', 'Noto Serif JP', serif;
    font-weight:700;
    font-size:1.5rem;
    margin:0 0 2px 56px;
    letter-spacing:.02em;
  }
  .sub{
    margin:0 0 14px 56px;
    font-size:.78rem;
    color:var(--ink-soft);
    letter-spacing:.04em;
  }

  .searchwrap{
    margin:0 16px 12px 56px;
    display:flex;
    gap:8px;
  }
  #search{
    flex:1;
    font-family:'Noto Sans JP',sans-serif;
    font-size:.95rem;
    padding:9px 12px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }
  #search:focus{outline:2px solid var(--accent); outline-offset:1px;}
  #count{
    align-self:center;
    font-size:.72rem;
    color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;
    white-space:nowrap;
  }

  nav#tabs{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding:0 16px 0 56px;
    scrollbar-width:thin;
  }
  nav#tabs::-webkit-scrollbar{height:5px;}
  nav#tabs::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .tab{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:.76rem;
    font-weight:600;
    padding:7px 12px 8px;
    border:1.5px solid var(--ink);
    border-bottom:none;
    border-radius:6px 6px 0 0;
    background:var(--paper2);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    top:1px;
  }
  .tab .num{color:var(--amber); margin-right:5px;}
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    border-bottom:2px solid var(--paper);
  }
  .tab.active .num{color:var(--accent);}

  main{
    max-width:900px;
    margin:0 auto;
    padding:18px 16px 60px;
  }

  .unit-heading{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:26px 0 12px;
  }
  .unit-heading:first-child{margin-top:6px;}
  .unit-heading .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    font-weight:700;
    color:#ffffff !important;
    background:#1E4D3E !important;
    padding:3px 9px;
    border-radius:3px;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .unit-heading h2{
    font-family:'Noto Serif JP',serif;
    font-size:1.05rem;
    font-weight:700;
    margin:0;
    color:#20281F !important;
    background:var(--paper);
    padding:1px 4px 1px 0;
  }
  .unit-heading::after{
    content:"";
    flex:1;
    border-bottom:1px dashed var(--line);
    transform:translateY(-2px);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media(min-width:640px){
    .grid{grid-template-columns:1fr 1fr;}
  }

  .card{
    background:#fff;
    border:1.5px solid var(--ink);
    border-left:4px solid var(--margin-red);
    border-radius:2px 8px 8px 2px;
    padding:12px 14px 13px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translate(1px,-1px); box-shadow:2px 3px 0 var(--line);}
  .card .name{
    font-family:'Noto Serif JP',serif;
    font-weight:700;
    font-size:.86rem;
    margin:0 0 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .card .name .plus{
    font-family:'JetBrains Mono',monospace;
    color:var(--ink-soft);
    font-size:.9rem;
    transition:transform .15s ease;
    flex:none;
  }
  .card.open .name .plus{transform:rotate(45deg); color:var(--accent);}
  .formula{
    font-size:1.02rem;
    overflow-x:auto;
    padding:4px 0 2px;
  }
  .note-wrap{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .card.open .note-wrap{
    max-height:700px;
  }
  .note-inner{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
  }
  .point{
    display:flex;
    gap:8px;
    align-items:flex-start;
    margin-bottom:2px;
  }
  .point-label{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:.62rem;
    font-weight:700;
    color:#fff;
    background:var(--amber);
    padding:2px 6px;
    border-radius:3px;
    letter-spacing:.04em;
    margin-top:2px;
  }
  .point p{
    margin:0;
    font-size:.83rem;
    color:var(--ink);
    line-height:1.7;
  }
  .example{
    margin-top:10px;
    background:var(--paper2);
    border:1px dashed var(--line);
    border-radius:6px;
    padding:9px 10px 10px;
  }
  .example .ex-label{
    font-family:'JetBrains Mono',monospace;
    font-size:.65rem;
    font-weight:700;
    color:var(--accent);
    letter-spacing:.05em;
    display:block;
    margin-bottom:4px;
  }
  .example .ex-q{
    font-size:.82rem;
    color:var(--ink);
    margin:0 0 8px;
    line-height:1.6;
  }
  .ans-toggle{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    padding:5px 10px;
    border-radius:14px;
    cursor:pointer;
    user-select:none;
    transition:background .12s ease;
  }
  .ans-toggle:hover{background:#245747;}
  .ans-toggle .arrow{transition:transform .15s ease; font-size:.7rem;}
  .example.revealed .ans-toggle .arrow{transform:rotate(90deg);}
  .ans-box{
    max-height:0;
    overflow:hidden;
    transition:max-height .2s ease;
  }
  .example.revealed .ans-box{
    max-height:200px;
    margin-top:8px;
  }
  .ans-box-inner{
    font-size:.82rem;
    color:var(--ink);
    background:#fff;
    border-left:3px solid var(--amber);
    padding:7px 10px;
    line-height:1.6;
  }
  .ans-box-inner b{color:var(--amber);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'Noto Serif JP',serif;
  }

  footer{
    text-align:center;
    font-size:.7rem;
    color:var(--ink-soft);
    padding:20px;
    font-family:'JetBrains Mono',monospace;
  }
</style>
</head>
<body>

<header>
  <h1>公式ノート</h1>
  <p class="sub">高校数学 公式一覧シミュレータ — I / A / II / B / III / C</p>
  <div class="searchwrap">
    <input id="search" type="text" placeholder="公式名やキーワードで検索（例：加法定理、微分）">
    <span id="count"></span>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="main"></main>
<footer>＋でPOINT解説と例題、答えのボタンでヒントを確認できます。</footer>

<script>
const DATA = [
{subject:"数学I", num:"1", units:[
  {unit:"数と式", items:[
    {name:"展開公式（2乗）", tex:"(a\\pm b)^2 = a^2 \\pm 2ab + b^2",
     note:"「2乗のかたまり」を見たら、まず両端を2乗、真ん中は2倍のかけ算にする。符号はaとbの間の符号がそのまま真ん中の項につくよ。慣れるまでは(a+b)(a+b)を実際に展開して確認しよう。",
     ex:"(x+3)² を展開しなさい。", ans:"x² + 6x + 9"},
    {name:"展開公式（3乗）", tex:"(a\\pm b)^3 = a^3 \\pm 3a^2b + 3ab^2 \\pm b^3",
     note:"係数の1・3・3・1はパスカルの三角形の3段目。符号は+から始めて交互に変わるのは差の場合だけなので注意。数値が大きくなるので焦らず順番に計算しよう。",
     ex:"(x+1)³ を展開しなさい。", ans:"x³ + 3x² + 3x + 1"},
    {name:"和と差の積", tex:"(a+b)(a-b) = a^2-b^2",
     note:"「同じ2つの数の和と差」をかけると真ん中の項が消えて2乗の差だけが残る、というとても便利な形。因数分解の場面では逆向きに「2乗−2乗を見たら分解できる」と考えよう。",
     ex:"(x+5)(x-5) を計算しなさい。", ans:"x² − 25"},
    {name:"3乗の和・差の因数分解", tex:"a^3\\pm b^3=(a\\pm b)(a^2\\mp ab+b^2)",
     note:"覚え方は「同符号・逆符号・同符号」。前の（　）はaとbの符号がそのまま、後ろの（　）は真ん中だけ符号が逆になるのがポイントだよ。",
     ex:"x³ − 8 を因数分解しなさい。", ans:"(x − 2)(x² + 2x + 4)"}
  ]},
  {unit:"2次関数", items:[
    {name:"2次方程式の解の公式", tex:"x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}",
     note:"因数分解できない2次方程式でも必ず解ける「最終手段」の公式。ax²+bx+c=0のa,b,cの値をそのまま代入するだけでOK。√の中身（判別式）がマイナスなら実数解はなしになるよ。",
     ex:"x² − 3x + 1 = 0 を解きなさい。", ans:"x = (3 ± √5) / 2"},
    {name:"判別式", tex:"D=b^2-4ac",
     note:"解の公式の√の中身だけを取り出したもの。実際に解を求めなくても、Dの符号を見るだけで実数解が2個・1個・0個のどれかがすぐわかる、とても効率のいい道具だよ。",
     ex:"x² + 2x + 5 = 0 の実数解の個数を判定しなさい。", ans:"D = 4 − 20 = −16 < 0 → 実数解なし"},
    {name:"頂点の座標（平方完成）", tex:"y=a(x-p)^2+q \\;\\Rightarrow\\; \\text{頂点}(p,\\,q)",
     note:"2次関数のグラフの一番高い（低い）点を求めるテクニック。x²+bxの部分を(x+○)²の形に無理やり作り直すのがコツで、グラフの形やずれをイメージしながら計算すると忘れにくいよ。",
     ex:"y = x² − 4x + 1 の頂点を求めなさい。", ans:"y=(x−2)²−3 → 頂点(2, −3)"},
    {name:"解と係数の関係", tex:"\\alpha+\\beta=-\\dfrac{b}{a},\\quad \\alpha\\beta=\\dfrac{c}{a}",
     note:"実際に2次方程式を解かなくても、係数だけから2解の「和」と「積」がわかってしまう便利な関係。α、βを使った式の値を求める問題でとてもよく使われるよ。",
     ex:"2x² − 5x + 3 = 0 の2解の和と積を求めなさい。", ans:"和 = 5/2、積 = 3/2"}
  ]},
  {unit:"図形と計量", items:[
    {name:"三角比の相互関係", tex:"\\sin^2\\theta+\\cos^2\\theta=1,\\quad \\tan\\theta=\\dfrac{\\sin\\theta}{\\cos\\theta}",
     note:"直角三角形の3辺の関係（三平方の定理）から生まれる公式。sinとcosのどちらか一方がわかれば、この式からもう一方が求められる、と覚えておこう。",
     ex:"sinθ = 3/5（0°<θ<90°）のとき cosθ を求めなさい。", ans:"cosθ = 4/5"},
    {name:"正弦定理", tex:"\\dfrac{a}{\\sin A}=\\dfrac{b}{\\sin B}=\\dfrac{c}{\\sin C}=2R", 
     note:"「辺と向かい合う角のsin」の比はどこを取っても同じ、という定理。外接円の半径Rまで一気に求まるのが強み。辺と角が1組＋もう1つの情報がわかっているときに使おう。",
     ex:"A=30°、a=4 のとき外接円の半径Rを求めなさい。", ans:"2R = 4/sin30° = 8 → R = 4"},
    {name:"余弦定理", tex:"a^2=b^2+c^2-2bc\\cos A", 
     note:"直角三角形じゃない三角形でも使える三平方の定理の拡張版。「2辺とその間の角」から残りの辺を求めたり、「3辺」から角のcosを求めたりできる、応用範囲が広い公式だよ。",
     ex:"b=3, c=4, A=60° のとき a を求めなさい。", ans:"a² = 9+16−2·3·4·(1/2)=13 → a=√13"},
    {name:"三角形の面積", tex:"S=\\dfrac{1}{2}bc\\sin A",
     note:"「底辺×高さ÷2」のsinバージョン。2辺とその間の角さえわかれば、高さを求めなくても面積が一発で出せる、テストでも大活躍の公式だよ。",
     ex:"b=6, c=4, A=30° のとき面積Sを求めなさい。", ans:"S = 1/2·6·4·sin30° = 6"}
  ]},
  {unit:"データの分析", items:[
    {name:"分散", tex:"s^2=\\dfrac{1}{n}\\sum_{i=1}^n (x_i-\\bar{x})^2",
     note:"データが平均からどれくらいバラついているかを数値化したもの。手順は「①平均を求める→②各データと平均の差を2乗→③その平均をとる」の3ステップで計算しよう。",
     ex:"データ 2,4,6 の分散を求めなさい。", ans:"平均4、分散=(4+0+4)/3=8/3"},
    {name:"標準偏差", tex:"s=\\sqrt{s^2}",
     note:"分散は2乗した値なので単位がずれてしまう。それを元の単位に戻すために√をとったものが標準偏差。「実際のデータの散らばり具合」を表す数値として使われるよ。",
     ex:"分散が9のときの標準偏差を求めなさい。", ans:"s = 3"},
    {name:"相関係数", tex:"r=\\dfrac{s_{xy}}{s_x s_y}",
     note:"2つのデータの間にどれくらい関係があるかを−1〜1の数値で表す指標。1に近いほど強い正の相関、−1に近いほど強い負の相関、0に近いほど関係が薄いと判断できるよ。",
     ex:"共分散4、xの標準偏差2、yの標準偏差2のときrを求めなさい。", ans:"r = 4/(2×2) = 1"}
  ]}
]},
{subject:"数学A", num:"2", units:[
  {unit:"場合の数と確率", items:[
    {name:"順列", tex:"{}_nP_r=\\dfrac{n!}{(n-r)!}",
     note:"「順番を区別して並べる」ときに使う公式。n個から1つ選ぶ→また1つ選ぶ…をr回繰り返すイメージで、n×(n-1)×…×(n-r+1)と考えるとわかりやすいよ。",
     ex:"5人から3人を選んで並べる方法は何通りか。", ans:"₅P₃ = 5·4·3 = 60通り"},
    {name:"組合せ", tex:"{}_nC_r=\\dfrac{n!}{r!(n-r)!}",
     note:"「順番を区別しない選び方」の公式。順列₍ₙPᵣ₎を求めてから、並べ方の重複分（r!通り）で割ればいい、という関係を覚えておくと理解しやすいよ。",
     ex:"5人から3人を選ぶ方法は何通りか。", ans:"₅C₃ = 10通り"},
    {name:"余事象の確率", tex:"P(\\overline{A})=1-P(A)",
     note:"「少なくとも1つは〜」という問題で直接数えるのが大変なときの必殺技。求めたい事象の反対（起こらない場合）を求めて1から引くだけで答えが出せるよ。",
     ex:"サイコロを1回振って1が出ない確率を求めなさい。", ans:"1 − 1/6 = 5/6"},
    {name:"加法定理（確率）", tex:"P(A\\cup B)=P(A)+P(B)-P(A\\cap B)",
     note:"AまたはBが起こる確率は、それぞれの確率を足すだけだと「両方起こる場合」を2回数えてしまう。だから重なった部分を1回分だけ引いてあげる、というイメージを持とう。",
     ex:"P(A)=0.4, P(B)=0.3, P(A∩B)=0.1 のときP(A∪B)を求めなさい。", ans:"0.4+0.3−0.1 = 0.6"},
    {name:"期待値", tex:"E(X)=\\sum_{i} x_i\\,p_i",
     note:"「平均するとどのくらいの値になるか」を表す数値。それぞれの結果×その起こる確率を全部足し合わせるだけ。ゲームや賞金の問題でよく登場するよ。",
     ex:"1個のサイコロの出た目の期待値を求めなさい。", ans:"(1+2+3+4+5+6)/6 = 3.5"}
  ]},
  {unit:"整数の性質", items:[
    {name:"ユークリッドの互除法", tex:"\\gcd(a,b)=\\gcd(b,\\,a\\bmod b)",
     note:"大きい数の最大公約数を、割り算を繰り返すだけで簡単に求められる方法。「大きい方を小さい方で割った余り」に置き換えていき、余りが0になったときの割る数が答えだよ。",
     ex:"gcd(48, 18) を求めなさい。", ans:"48=18·2+12, 18=12·1+6, 12=6·2+0 → gcd=6"},
    {name:"合同式の基本", tex:"a\\equiv b \\pmod{m}\\;\\Longleftrightarrow\\; m\\mid(a-b)",
     note:"「mで割った余りが同じ数どうし」を1つのグループとして扱う考え方。余りにだけ注目すればいいので、大きな数の計算がぐっと楽になるよ。",
     ex:"17 は 5 を法として何と合同か。", ans:"17 = 5×3+2 → 17≡2 (mod 5)"}
  ]},
  {unit:"図形の性質", items:[
    {name:"角の二等分線の性質", tex:"\\dfrac{BD}{DC}=\\dfrac{AB}{AC}",
     note:"角を半分に分ける線を引くと、向かい合う辺もちょうど同じ比に分けられる、という覚えやすい性質。「二等分線→比が移る」とセットで覚えておこう。",
     ex:"AB=6, AC=4のときBD:DCを求めなさい。", ans:"BD:DC = 6:4 = 3:2"},
    {name:"方べきの定理", tex:"PA\\cdot PB=PC\\cdot PD",
     note:"円を通る2本の直線が1点で交わるとき、それぞれの交点までの長さの積が等しくなる、という円の性質。2つの直線の組み合わせを見つけて公式に当てはめよう。",
     ex:"PA=3, PB=4, PC=2 のときPDを求めなさい。", ans:"3×4=2×PD → PD=6"},
    {name:"チェバの定理", tex:"\\dfrac{BD}{DC}\\cdot\\dfrac{CE}{EA}\\cdot\\dfrac{AF}{FB}=1",
     note:"三角形の中の1点から伸びる3本の線が作る比を全部かけると必ず1になる、という美しい定理。図の頂点をぐるっと一周する順番で比をかけていくのがコツだよ。",
     ex:"BD/DC=2, CE/EA=1/2 のときAF/FBを求めなさい。", ans:"2×(1/2)×(AF/FB)=1 → AF/FB=1"}
  ]}
]},
{subject:"数学II", num:"3", units:[
  {unit:"式と証明", items:[

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
let activeSubject = "ALL";

function totalCount(){
  let c=0; DATA.forEach(s=>s.units.forEach(u=>c+=u.items.length)); return c;
}

function buildTabs(){
  tabsEl.innerHTML = '';
  const allTab = document.createElement('div');
  allTab.className = 'tab' + (activeSubject==='ALL' ? ' active':'');
  allTab.innerHTML = `<span class="num">全</span>すべて`;
  allTab.onclick = ()=>{activeSubject='ALL'; render();};
  tabsEl.appendChild(allTab);
  DATA.forEach(s=>{
    const t = document.createElement('div');
    t.className = 'tab' + (activeSubject===s.subject ? ' active':'');
    t.innerHTML = `<span class="num">${s.num}</span>${s.subject}`;
    t.onclick = ()=>{activeSubject=s.subject; render();};
    tabsEl.appendChild(t);
  });
}

function matches(item, unit, subject, q){
  if(!q) return true;
  q = q.toLowerCase();
  return (item.name.toLowerCase().includes(q) ||
          item.note.toLowerCase().includes(q) ||
          unit.toLowerCase().includes(q) ||
          subject.toLowerCase().includes(q) ||
          item.tex.toLowerCase().includes(q));
}

function render(){
  buildTabs();
  const q = searchEl.value.trim();
  mainEl.innerHTML = '';
  let shown = 0;

  DATA.forEach(s=>{
    if(activeSubject!=='ALL' && activeSubject!==s.subject) return;
    s.units.forEach(u=>{
      const filtered = u.items.filter(it=>matches(it,u.unit,s.subject,q));
      if(filtered.length===0) return;
      shown += filtered.length;

      const h = document.createElement('div');
      h.className = 'unit-heading';
      h.innerHTML = `<span class="tag">${s.subject}</span><h2>${u.unit}</h2>`;
      mainEl.appendChild(h);

      const grid = document.createElement('div');
      grid.className = 'grid';
      filtered.forEach(it=>{
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <p class="name"><span>${it.name}</span><span class="plus">+</span></p>
          <div class="formula"><span class="katex-target"></span></div>
          <div class="note-wrap"><div class="note-inner">
            <div class="point"><span class="point-label">POINT</span><p>${it.note}</p></div>
            <div class="example">
              <span class="ex-label">例題</span>
              <p class="ex-q">${it.ex}</p>
              <div class="ans-toggle"><span class="arrow">▸</span>答えを見る</div>
              <div class="ans-box"><div class="ans-box-inner"><b>答え：</b>${it.ans}</div></div>
            </div>
          </div></div>
        `;
        card.onclick = ()=> card.classList.toggle('open');
        const ansToggle = card.querySelector('.ans-toggle');
        ansToggle.onclick = (e)=>{
          e.stopPropagation();
          ansToggle.closest('.example').classList.toggle('revealed');
        };
        grid.appendChild(card);
        const target = card.querySelector('.katex-target');
        try{
          katex.render(it.tex, target, {throwOnError:false, displayMode:false});
        }catch(e){ target.textContent = it.tex; }
      });
      mainEl.appendChild(grid);
    });
  });

  countEl.textContent = `${shown} / ${totalCount()} 件`;

  if(shown===0){
    mainEl.innerHTML = `<div class="empty">該当する公式が見つかりませんでした。<br>キーワードを変えて検索してください。</div>`;
  }
}

searchEl.addEventListener('input', render);
render();
</script>
</body>
</html>
