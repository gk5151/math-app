<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>デモシミュレータ</title><style>body{font-family:Arial,"Noto Sans JP",sans-serif;margin:0;padding:24px;background:#fffdf7;color:#263238}h1{font-family:Georgia,"Noto Serif JP",serif}.box{border:1px solid #dce2e4;padding:20px;background:white;max-width:700px}input{width:100%;accent-color:#3d6f8e}canvas{width:100%;height:300px;border:1px solid #ddd;background:#fafafa}</style></head><body><div class="box"><h1>📐 二次関数デモ</h1><p>係数 a を動かして放物線の変化を確認できます。</p><input id="a" type="range" min="-3" max="3" step=".1" value="1"><b id="v">a = 1</b><canvas id="c" width="800" height="300"></canvas></div><script>const a=document.getElementById("a"),v=document.getElementById("v"),c=document.getElementById("c"),x=c.getContext("2d");function draw(){let A=+a.value;v.textContent="a = "+A;x.clearRect(0,0,c.width,c.height);x.beginPath();x.moveTo(400,0);x.lineTo(400,300);x.moveTo(0,150);x.lineTo(800,150);x.stroke();x.beginPath();for(let px=0;px<=800;px++){let xx=(px-400)/40,yy=A*xx*xx,py=150-yy*20;if(px===0)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke()}a.oninput=draw;draw();</script></body></html>
