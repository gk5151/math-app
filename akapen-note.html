<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>赤ペン先生ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA;
    --paper-edge:#EFE6D0;
    --rule:#C9D6E8;
    --margin-line:#E3A79B;
    --ink:#1F2C46;
    --ink-soft:#3A4A6B;
    --pencil:#8A8172;
    --red:#C0392B;
    --red-deep:#8E2A1F;
    --red-soft:#F3DCD8;
  }
  *{box-sizing:border-box;}
  html, body{
    overscroll-behavior:none;
  }
  body{
    margin:0;
    background:#EDE7D8;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:18px 10px 40px;
  }
  .book{
    width:100%;
    max-width:460px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 1px 0 var(--paper-edge), 0 10px 24px rgba(60,45,20,0.14);
    overflow:hidden;
    position:relative;
  }
  .book::before{
    content:"";
    position:absolute;
    top:0; right:0; width:34px; height:34px;
    background:linear-gradient(135deg, transparent 50%, #E3D9BE 50%);
  }
  header{
    padding:22px 24px 6px 30px;
  }
  h1{
    font-family:'Klee One', sans-serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
    color:var(--ink);
    letter-spacing:.02em;
  }
  .sub{
    font-size:12.5px;
    color:var(--pencil);
    line-height:1.6;
    margin:0 0 14px;
  }
  .sub b{ color:var(--ink-soft); font-weight:500; }

  .tabs{
    display:flex;
    gap:6px;
    margin:0 0 12px;
  }
  .tab{
    font-family:'Klee One', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:7px 14px;
    border-radius:20px;
    border:1px solid #D8CCA9;
    background:#FFFDF6;
    color:var(--pencil);
    cursor:pointer;
  }
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#FBF6EA;
  }

  .quizpanel{
    display:none;
    margin:0 14px 14px 30px;
    padding:12px 14px;
    background:#FFFDF6;
    border:1px solid #E3D9BE;
    border-radius:10px;
  }
  .quizpanel.show{ display:block; }
  .quizrow{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  select{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    border:1px solid #D8CCA9;
    background:#fff;
    border-radius:8px;
    padding:6px 8px;
    flex:1;
  }
  .gen-btn{
    width:100%;
    font-family:'Klee One', sans-serif;
    font-weight:600;
    background:var(--ink);
    color:#FBF6EA;
    border-color:var(--ink);
  }
  .reveal-btn{
    width:100%;
    margin-top:8px;
    font-family:'Klee One', sans-serif;
    font-weight:600;
    background:#FFFDF6;
    color:#8A6A1F;
    border-color:#D9B45C;
  }
  button:disabled{ opacity:0.5; cursor:default; }

  .problemcard{
    display:none;
    margin:0 14px 14px 30px;
    padding:14px 16px;
    background:#FFFEF9;
    border:1px solid #E3D9BE;
    border-left:3px solid var(--ink);
    border-radius:0 10px 10px 0;
  }
  .problemcard.show{ display:block; }
  .problem-tag{
    font-family:'Klee One', sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .problem-text{
    font-size:14px;
    line-height:1.7;
    color:var(--ink);
    margin:0;
  }

  .padwrap{
    position:relative;
    margin:0 14px 14px 0;
    border-left:2px solid var(--margin-line);
    overflow:hidden;
    height:340px;
  }
  .drawLayer{
    position:absolute;
    inset:0;
    transform-origin:0 0;
  }
  .ruled{
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 31px,
      var(--rule) 31px,
      var(--rule) 32px
    );
    pointer-events:none;
  }
  canvas{
    display:block;
    width:100%;
    height:340px;
    touch-action:none;
    cursor:crosshair;
    position:relative;
    background:transparent;
  }
  .zoomtag{
    position:absolute;
    right:8px;
    bottom:8px;
    font-size:11px;
    color:var(--pencil);
    background:rgba(255,253,246,0.85);
    padding:3px 8px;
    border-radius:10px;
    pointer-events:none;
    z-index:2;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 16px 4px 30px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    border:1px solid #D8CCA9;
    background:#FFFDF6;
    color:var(--ink-soft);
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  button:active{ transform:scale(0.97); }
  button.tool-active{
    background:var(--ink);
    color:#FBF6EA;
    border-color:var(--ink);
  }
  .spacer{ flex:1; }
  .grade-btn{
    font-family:'Klee One', sans-serif;
    font-weight:600;
    font-size:14px;
    color:#fff;
    background:var(--red);
    border-color:var(--red-deep);
    padding:9px 18px;
  }
  .grade-btn:disabled{ opacity:0.55; }

  .result{
    margin:6px 16px 22px 30px;
    padding:14px 16px;
    border:1.5px dashed var(--red);
    border-radius:10px;
    background:var(--red-soft);
    display:none;
  }
  .result.show{ display:block; }
  .result.err{
    background:#F1E7E4;
    border-color:var(--pencil);
  }
  .result.hint{
    background:#FFF6DE;
    border-color:#D9B45C;
    border-style:dashed;
  }
  .r-line{
    display:flex;
    gap:8px;
    align-items:baseline;
    margin:0 0 8px;
  }
  .r-mark{
    font-family:'Klee One', sans-serif;
    font-weight:600;
    font-size:20px;
    color:var(--red);
    flex-shrink:0;
  }
  .r-recognized{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .r-steps{
    margin:6px 0 10px 28px;
    padding:0;
    list-style:none;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.75;
  }
  .r-steps li{ position:relative; padding-left:14px; }
  .r-steps li::before{
    content:"・";
    position:absolute; left:0;
    color:var(--red);
  }
  .r-answer{
    font-family:'Klee One', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--red-deep);
    margin-left:28px;
    display:inline-block;
    padding:2px 10px;
    border:2px solid var(--red);
    border-radius:50%;
  }
  .r-comment{
    margin:10px 0 0 28px;
    font-family:'Klee One', sans-serif;
    font-size:13px;
    color:var(--red-deep);
  }
  .loading{
    display:none;
    margin:6px 16px 22px 30px;
    font-size:12.5px;
    color:var(--pencil);
    font-family:'Klee One', sans-serif;
  }
  .loading.show{ display:block; }
</style>
</head>
<body>
<div class="book">
  <header>
    <h1>手書き計算ノート</h1>
    <div class="tabs">
      <button type="button" class="tab active" id="noteTab">📓 ノート</button>
      <button type="button" class="tab" id="quizTab">🎓 高校数学</button>
    </div>
    <p class="sub" id="noteSub">指やペンで直接書いてね。<b>計算式</b>・<b>文章問題</b>・<b>図形（寸法つき）</b>、なんでもOK。2本指でつまむと拡大縮小できるよ。書き終わったら「赤ペンで採点」を押してね。</p>
    <p class="sub" id="quizSub" style="display:none;">科目と単元を選んで問題を出そう。答えはこの下に手書きして、「答え合わせ」を押してね。2本指で拡大縮小できるよ。</p>
  </header>

  <div class="quizpanel" id="quizPanel">
    <div class="quizrow">
      <select id="subjectSelect"></select>
      <select id="unitSelect"></select>
    </div>
    <button type="button" class="gen-btn" id="genProblemBtn">問題を出す</button>
    <button type="button" class="reveal-btn" id="revealBtn" disabled>答えを教えて</button>
  </div>

  <div class="problemcard" id="problemCard"></div>

  <div class="padwrap" id="padwrap">
    <div class="drawLayer" id="drawLayer">
      <div class="ruled"></div>
      <canvas id="canvas"></canvas>
    </div>
    <div class="zoomtag" id="zoomTag">100%</div>
  </div>

  <div class="toolbar">
    <button type="button" id="penBtn" class="tool-active">✏️ ペン</button>
    <button type="button" id="eraserBtn">🧽 消しゴム</button>
    <button type="button" id="undoBtn">↩ 戻す</button>
    <button type="button" id="clearBtn">全消し</button>
    <button type="button" id="zoomResetBtn">🔍 拡大戻す</button>
    <span class="spacer"></span>
    <button type="button" id="gradeBtn" class="grade-btn">赤ペンで採点</button>
  </div>

  <div class="loading" id="loading">先生が読んでいます…</div>
  <div class="result" id="result"></div>
</div>

<script>
/* ---------- DOM refs ---------- */
const padwrap = document.getElementById('padwrap');
const drawLayer = document.getElementById('drawLayer');
const canvas = document.getElementById('canvas');
const ctx = canvas ? canvas.getContext('2d') : null;
const zoomTag = document.getElementById('zoomTag');

const noteTab = document.getElementById('noteTab');
const quizTab = document.getElementById('quizTab');
const noteSub = document.getElementById('noteSub');
const quizSub = document.getElementById('quizSub');
const quizPanel = document.getElementById('quizPanel');
const problemCard = document.getElementById('problemCard');
const subjectSelect = document.getElementById('subjectSelect');
const unitSelect = document.getElementById('unitSelect');
const genProblemBtn = document.getElementById('genProblemBtn');
const revealBtn = document.getElementById('revealBtn');
const gradeBtn = document.getElementById('gradeBtn');
const loadingEl = document.getElementById('loading');
const resultEl = document.getElementById('result');
const penBtn = document.getElementById('penBtn');
const eraserBtn = document.getElementById('eraserBtn');
const undoBtn = document.getElementById('undoBtn');
const clearBtn = document.getElementById('clearBtn');
const zoomResetBtn = document.getElementById('zoomResetBtn');

/* ---------- state ---------- */
let strokes = [];
let currentStroke = null;
let tool = 'pen';
let mode = 'note';
let currentProblem = null;
let dpr = Math.max(window.devicePixelRatio || 1, 1);

/* pinch-zoom view state: canvas element is transformed with translate(viewX,viewY) scale(viewScale) */
let viewScale = 1, viewX = 0, viewY = 0;
const MIN_SCALE = 1, MAX_SCALE = 4;
const activePointers = new Map(); // pointerId -> {x,y} in client coords
let pinch = null; // {initialDist, s0, tx0, ty0, anchorX, anchorY}

const UNIT_MAP = {
  "数I": ["数と式","図形と計量","二次関数","データの分析"],
  "数A": ["場合の数と確率","図形の性質","整数の性質"],
  "数II": ["いろいろな式","図形と方程式","指数関数・対数関数","三角関数","微分・積分の考え"],
  "数B": ["数列","統計的な推測"],
  "数III": ["極限","微分法","積分法"],
  "数C": ["ベクトル","平面上の曲線と複素数平面"]
};
const SUBJECTS = Object.keys(UNIT_MAP);

/* ---------- small helpers (no canvas dependency) ---------- */
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function hideResult(){
  resultEl.className = 'result';
  resultEl.innerHTML = '';
}
function showError(msg){
  resultEl.className = 'result show err';
  resultEl.innerHTML = '<div class="r-line"><span class="r-mark">△</span><span class="r-recognized">' + escapeHtml(msg) + '</span></div>';
}
function fillOption(sel, label, value){
  const o = document.createElement('option');
  o.textContent = label;
  o.value = value === undefined ? label : value;
  sel.appendChild(o);
}
function refreshUnitOptions(){
  unitSelect.innerHTML = '';
  const subj = subjectSelect.value;
  if(subj === 'ランダム'){
    fillOption(unitSelect, 'ランダム');
    unitSelect.disabled = true;
    return;
  }
  unitSelect.disabled = false;
  fillOption(unitSelect, 'ランダム');
  UNIT_MAP[subj].forEach(u => fillOption(unitSelect, u));
}
function switchMode(m){
  mode = m;
  noteTab.classList.toggle('active', m==='note');
  quizTab.classList.toggle('active', m==='quiz');
  noteSub.style.display = m==='note' ? '' : 'none';
  quizSub.style.display = m==='quiz' ? '' : 'none';
  quizPanel.classList.toggle('show', m==='quiz');
  gradeBtn.textContent = m==='quiz' ? '答え合わせ' : '赤ペンで採点';
  if(m === 'note'){
    problemCard.classList.remove('show');
    currentProblem = null;
    revealBtn.disabled = true;
  }
  strokes = [];
  redraw();
  hideResult();
}

/* ---------- pinch-zoom view ---------- */
function applyView(){
  if(!drawLayer) return;
  drawLayer.style.transform = 'translate(' + viewX + 'px, ' + viewY + 'px) scale(' + viewScale + ')';
  if(zoomTag) zoomTag.textContent = Math.round(viewScale*100) + '%';
}
function resetView(){
  viewScale = 1; viewX = 0; viewY = 0;
  applyView();
}
function clampView(){
  if(!drawLayer || !padwrap) return;
  const cw = drawLayer.clientWidth || 1;
  const ch = drawLayer.clientHeight || 1;
  const containerW = padwrap.clientWidth;
  const containerH = padwrap.clientHeight;
  const minTx = Math.min(0, containerW - cw*viewScale);
  const minTy = Math.min(0, containerH - ch*viewScale);
  if(viewX > 0) viewX = 0;
  if(viewX < minTx) viewX = minTx;
  if(viewY > 0) viewY = 0;
  if(viewY < minTy) viewY = minTy;
}

/* ---------- canvas drawing ---------- */
function pos(e){
  /* screen point -> container-local -> undo pinch view transform -> CSS layout-local -> internal buffer pixel */
  const rect = padwrap.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const lx = (sx - viewX) / viewScale;
  const ly = (sy - viewY) / viewScale;
  return [ lx * dpr, ly * dpr ];
}
function drawStroke(s){
  if(!ctx || s.points.length < 1) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = s.width * dpr;
  if(s.tool === 'eraser'){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#1F2C46';
  }
  ctx.beginPath();
  ctx.moveTo(s.points[0][0], s.points[0][1]);
  if(s.points.length === 1){
    ctx.lineTo(s.points[0][0]+0.1, s.points[0][1]+0.1);
  }
  for(let i=1;i<s.points.length;i++){
    ctx.lineTo(s.points[i][0], s.points[i][1]);
  }
  ctx.stroke();
  ctx.restore();
}
function redraw(){
  if(!ctx) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const s of strokes){ drawStroke(s); }
}
function resizeCanvas(){
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  dpr = Math.max(window.devicePixelRatio || 1, 1);
  canvas.width = Math.max(rect.width,1) * dpr;
  canvas.height = Math.max(rect.height,1) * dpr;
  redraw();
}
function endDrawing(){ currentStroke = null; }
function exportImage(){
  const temp = document.createElement('canvas');
  temp.width = canvas.width;
  temp.height = canvas.height;
  const tctx = temp.getContext('2d');
  tctx.fillStyle = '#FFFFFF';
  tctx.fillRect(0,0,temp.width,temp.height);
  tctx.drawImage(canvas,0,0);
  return temp.toDataURL('image/png').split(',')[1];
}

/* ---------- result rendering ---------- */
function renderResult(p){
  if(!p.readable){
    resultEl.className = 'result show err';
    resultEl.innerHTML = '<div class="r-line"><span class="r-mark">△</span><span class="r-recognized">' + escapeHtml(p.recognized || 'うまく読み取れませんでした。') + '</span></div>';
    return;
  }
  const steps = (p.steps||[]).map(s => '<li>' + escapeHtml(s) + '</li>').join('');
  resultEl.className = 'result show';
  resultEl.innerHTML =
    '<div class="r-line"><span class="r-mark">✔</span><span class="r-recognized">' + escapeHtml(p.recognized||'') + '</span></div>' +
    '<ul class="r-steps">' + steps + '</ul>' +
    '<div><span class="r-answer">' + escapeHtml(p.answer||'') + '</span></div>' +
    '<div class="r-comment">' + escapeHtml(p.comment||'') + '</div>';
}
function renderQuizResult(p){
  if(!p.readable){
    resultEl.className = 'result show err';
    resultEl.innerHTML = '<div class="r-line"><span class="r-mark">△</span><span class="r-recognized">' + escapeHtml(p.recognized || 'うまく読み取れませんでした。') + '</span></div>';
    return;
  }
  const mark = p.correct ? '◯' : '✕';
  const steps = (p.steps||[]).map(s => '<li>' + escapeHtml(s) + '</li>').join('');
  resultEl.className = 'result show';
  resultEl.innerHTML =
    '<div class="r-line"><span class="r-mark">' + mark + '</span><span class="r-recognized">' + escapeHtml(p.recognized||'') + '</span></div>' +
    '<ul class="r-steps">' + steps + '</ul>' +
    '<div><span class="r-answer">' + escapeHtml(p.correct_answer||'') + '</span></div>' +
    '<div class="r-comment">' + escapeHtml(p.comment||'') + '</div>';
}
function renderAnswerReveal(p){
  const steps = (p.steps||[]).map(s => '<li>' + escapeHtml(s) + '</li>').join('');
  resultEl.className = 'result show hint';
  resultEl.innerHTML =
    '<div class="r-line"><span class="r-mark" style="color:#B9860B;">💡</span><span class="r-recognized">この問題の正解を確認してみよう</span></div>' +
    '<ul class="r-steps">' + steps + '</ul>' +
    '<div><span class="r-answer" style="color:#B9860B;border-color:#B9860B;">' + escapeHtml(p.answer||'') + '</span></div>' +
    '<div class="r-comment" style="color:#B9860B;">諦めずに、自分の手でも解いてみてね！</div>';
}

/* ---------- prompts ---------- */
function buildNotePrompt(){
  return 'この画像には、紙に手書きされた内容が写っています。中身は「計算式（算数・数式）」「文章問題」「寸法つきの図形」のいずれかです。\n' +
'まず内容を読み取り、次に手順を追って解いてください。\n\n' +
'必ず次のJSON形式のみで、余計な文章やマークダウンのコードフェンスを付けずに返してください。\n\n' +
'{\n' +
'  "readable": true または false,\n' +
'  "recognized": "読み取った内容の説明（日本語、1〜2文）",\n' +
'  "type": "calculation" または "word_problem" または "geometry" または "other",\n' +
'  "steps": ["解き方の手順1", "手順2", "..."],\n' +
'  "answer": "最終的な答え（単位があれば含める）",\n' +
'  "comment": "赤ペン先生風の短い一言コメント（日本語、20文字程度）"\n' +
'}\n\n' +
'もし文字や図がうまく読み取れない場合は readable を false にし、recognized に「もう少し濃く書いてね」など具体的な改善アドバイスを日本語で入れ、他の項目は空文字や空配列にしてください。';
}
function buildQuizPrompt(){
  return '次は高校数学「' + currentProblem.subject + '／' + currentProblem.unit + '」の問題です。\n\n' +
'【問題】\n' + currentProblem.problem + '\n\n' +
'添付の画像は、この問題に対して生徒が手書きで書いた解答です。生徒の解答を読み取り、正しいかどうか判定し、正しい解き方を手順で示してください。\n' +
'最終的な答えが合っていれば、途中式の有無に関わらず correct は true にしてください。ただし、答えは合っているのに途中式や計算過程がほとんど書かれておらず答えだけが書かれている場合は、comment で「次は途中式も書いてみよう」のように途中式を書くことを優しく促してください。途中式がきちんと書かれている場合は、その調子で褒めてください。\n\n' +
'必ず次のJSON形式のみで、余計な文章やマークダウンのコードフェンスを付けずに返してください。\n\n' +
'{\n' +
'  "readable": true または false,\n' +
'  "recognized": "生徒の解答内容の要約（日本語、1〜2文）",\n' +
'  "correct": true または false,\n' +
'  "showed_work": true または false,\n' +
'  "steps": ["正しい解き方の手順1", "手順2", "..."],\n' +
'  "correct_answer": "正しい最終解答",\n' +
'  "comment": "赤ペン先生風の短いコメント（日本語、20〜30文字程度。答えのみで途中式がない場合は途中式を書くよう促す一言を含める）"\n' +
'}\n\n' +
'読み取れない場合は readable を false にし、recognized に具体的な改善アドバイスを日本語で入れ、correct は false、showed_work は false、steps は空配列、correct_answer は空文字にしてください。';
}

genProblemBtn.onclick = async function(){
  let subj = subjectSelect.value;
  if(subj === 'ランダム'){ subj = pickRandom(SUBJECTS); }
  let unit = unitSelect.value;
  if(unit === 'ランダム'){ unit = pickRandom(UNIT_MAP[subj]); }

  genProblemBtn.disabled = true;
  genProblemBtn.textContent = '問題を作っています…';
  revealBtn.disabled = true;
  hideResult();
  problemCard.classList.remove('show');
  strokes = [];
  redraw();

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 600,
        messages: [{
          role: "user",
          content: [{ type: "text", text:
            'あなたは高校数学の先生です。「' + subj + '」の「' + unit + '」の単元から、高校生向けの練習問題を1問作ってください。\n' +
            '問題文は日本語で簡潔に。数式はテキストで表現してください（例: x^2 - 3x + 2 = 0、sin(θ)、ベクトルはa→のように矢印つきで表現）。\n' +
            '図形問題の場合は必要な数値をすべて文章内に明記し、図そのものは不要です。\n' +
            '必ず「最終的な答えがひとつの数値・式・座標などに定まる」1問だけの問題にしてください。証明問題、(1)(2)(3)のように設問が複数に分かれる問題、答えが複数通りある問題は避けてください。\n' +
            'あわせて、その問題の正しい最終解答と、解き方の手順も日本語で用意してください（これは生徒にはまだ見せず、後で「答えを教えて」が押されたときに表示するためのものです）。\n\n' +
            '必ず次のJSON形式のみで、余計な文章やマークダウンのコードフェンスを付けずに返してください。\n' +
            '{\n  "subject": "' + subj + '",\n  "unit": "' + unit + '",\n  "problem": "問題文",\n  "answer": "正しい最終解答（単位があれば含める）",\n  "steps": ["解き方の手順1", "手順2", "..."]\n}'
          }]
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).map(function(b){ return b.text || ''; }).join('');
    const clean = textBlock.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    currentProblem = parsed;
    revealBtn.disabled = false;
    problemCard.classList.add('show');
    problemCard.innerHTML = '<p class="problem-tag">' + escapeHtml(parsed.subject||subj) + ' ／ ' + escapeHtml(parsed.unit||unit) + '</p><p class="problem-text">' + escapeHtml(parsed.problem||'') + '</p>';
  }catch(err){
    console.error(err);
    showError('問題を作れなかったみたい。もう一度「問題を出す」を押してみてね。');
  }finally{
    genProblemBtn.disabled = false;
    genProblemBtn.textContent = '問題を出す';
  }
};

gradeBtn.onclick = async function(){
  if(mode === 'quiz' && !currentProblem){
    showError('先に「問題を出す」を押して問題を表示してね。');
    return;
  }
  if(strokes.length === 0){
    showError(mode==='quiz' ? 'まだ答えが書かれていないみたい。書いてから押してね。' : 'まだ何も書かれていないみたい。式や問題を書いてから押してね。');
    return;
  }
  gradeBtn.disabled = true;
  loadingEl.classList.add('show');
  hideResult();

  try{
    const imgB64 = exportImage();
    const promptText = mode === 'quiz' ? buildQuizPrompt() : buildNotePrompt();
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1200,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: "image/png", data: imgB64 } },
            { type: "text", text: promptText }
          ]
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).map(function(b){ return b.text || ''; }).join('');
    const clean = textBlock.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    if(mode === 'quiz'){ renderQuizResult(parsed); } else { renderResult(parsed); }
  }catch(err){
    console.error(err);
    showError('うまく採点できなかったみたい。もう一度はっきり書いて、もう一回押してみてね。');
  }finally{
    gradeBtn.disabled = false;
    loadingEl.classList.remove('show');
  }
};

/* ---------- pointer handling: single finger draws, two fingers pinch-zoom/pan ---------- */
const PINCH_THRESHOLD = 40; // px separation required before a 2nd touch is treated as a real pinch (avoids palm/accidental touches)
let drawingPointerId = null;
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function midpoint(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }
function pointsInPadwrap(){
  const pts = Array.from(activePointers.values());
  const rect = padwrap.getBoundingClientRect();
  return pts.map(p => ({ x: p.x - rect.left, y: p.y - rect.top }));
}

function startPinch(){
  const [p0,p1] = pointsInPadwrap();
  const mid = midpoint(p0,p1);
  pinch = {
    initialDist: Math.max(dist(p0,p1), 1),
    s0: viewScale,
    tx0: viewX,
    ty0: viewY,
    anchorX: (mid.x - viewX) / viewScale,
    anchorY: (mid.y - viewY) / viewScale
  };
  /* cancel any in-progress single-finger stroke so the second finger doesn't leave a stray mark */
  if(currentStroke){
    const idx = strokes.indexOf(currentStroke);
    if(idx !== -1 && currentStroke.points.length < 3) strokes.splice(idx,1);
    currentStroke = null;
    drawingPointerId = null;
    redraw();
  }
}
function updatePinch(){
  if(!pinch) return;
  const [p0,p1] = pointsInPadwrap();
  const newDist = Math.max(dist(p0,p1), 1);
  const mid = midpoint(p0,p1);
  let s = pinch.s0 * (newDist / pinch.initialDist);
  s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));
  viewScale = s;
  viewX = mid.x - pinch.anchorX * s;
  viewY = mid.y - pinch.anchorY * s;
  clampView();
  applyView();
}

if(canvas){
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

  canvas.addEventListener('pointerdown', function(e){
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(activePointers.size === 1){
      drawingPointerId = e.pointerId;
      currentStroke = { tool: tool, width: tool==='eraser'? 18:2.6, points:[pos(e)] };
      strokes.push(currentStroke);
      redraw();
    } else if(activePointers.size === 2){
      const [p0,p1] = pointsInPadwrap();
      if(dist(p0,p1) > PINCH_THRESHOLD){
        startPinch();
      }
      /* else: likely a palm/accidental touch - ignore it, first finger keeps drawing */
    }
  });

  canvas.addEventListener('pointermove', function(e){
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(pinch){
      updatePinch();
      return;
    }
    if(activePointers.size === 2){
      const [p0,p1] = pointsInPadwrap();
      if(dist(p0,p1) > PINCH_THRESHOLD){
        startPinch();
        updatePinch();
      }
      return; /* two touches down but not yet a recognized pinch: don't draw */
    }
    if(e.pointerId === drawingPointerId && currentStroke){
      currentStroke.points.push(pos(e));
      redraw();
    }
  });

  function releasePointer(e){
    activePointers.delete(e.pointerId);
    if(activePointers.size < 2){
      pinch = null;
    }
    if(e.pointerId === drawingPointerId){
      drawingPointerId = null;
      endDrawing();
    }
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointerleave', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
}

/* ---------- risky canvas sizing, isolated so it can never block the bindings above ---------- */
window.addEventListener('resize', function(){
  try{ resizeCanvas(); }catch(err){ console.error(err); }
});
try{ resizeCanvas(); }catch(err){ console.error(err); }
applyView();
